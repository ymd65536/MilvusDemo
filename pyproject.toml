[project]
name = "milvus-validation-api"
version = "1.0.0"
description = "FastAPI application for validating major Milvus features"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.116.1",
    "httpx==0.28.1",
    "pydantic-settings==2.10.1",
    "pymilvus==2.6.1",
    "sentence-transformers==5.6.1",
    "uvicorn[standard]==0.35.0",
]

[dependency-groups]
dev = [
    "pytest==8.4.1",
    "ruff==0.12.8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
